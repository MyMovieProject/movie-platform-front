name: workflow

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
    build-and-deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '20'
            cache: 'npm'

        - name: Dependencies install
          run: npm ci

        - name: Build
          run: npm run build

        # 배포
        - name: Docker Hub Login
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Build and push image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/my-app-front:latest

        - name: Deploy to Server
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.HOST }}
            username: ${{ secrets.USERNAME }}
            key: ${{ secrets.SSH_KEY }}
            script: |
              docker pull ${{ secrets.DOCKER_USERNAME }}/my-app-front:latest
              
              if [ "$(docker ps -a -q -f name=my-front-app)" ]; then
              docker stop my-front-app
              docker rm my-front-app
              fi
              
              docker run -d \
                -m 256m \
                --network my-app-network \
                --name my-front-app \
                --restart unless-stopped \
                ${{ secrets.DOCKER_USERNAME }}/my-app-front:latest

#              docker run -d -p 80:80 -p 443:443 \
#              -m 256m \
#              --network my-app-network \
#              -v /etc/letsencrypt:/etc/letsencrypt:ro \
#              -v /var/www/certbot:/var/www/certbot:ro \
#              --name my-front-app \
#              ${{ secrets.DOCKER_USERNAME }}/my-app-front:latest